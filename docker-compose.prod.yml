services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  
  server:
    build:
      context: ./server
    expose:
      - "8080"


  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    expose:
      - "8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/media:/media
    restart: unless-stopped

  # more apps can be added later