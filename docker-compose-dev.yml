services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - frontend
  
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1   # allow listing/inspecting containers
      START: 1        # allow starting containers
      STOP: 1         # allow stopping containers
      RESTARTS: 1     # allow restarting containers
      POST: 1         # needed since start/stop/restart are POST requests

    expose:
      - "2375"

  server:
    build:
      context: ./server
    container_name: server
    expose:
      - "8080"
    volumes:
      - ./server/src:/backend/src

  frontend:
    build:
      context: ./dashboard/client
    container_name: hub
    expose:
      - "5173"
    depends_on:
      - server

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    expose:
      - "8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/media:/media
    restart: unless-stopped

  # more apps can be added later