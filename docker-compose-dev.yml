services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
  
  server:
    build:
      context: ./server
    expose:
      - "8080"
    volumes:
      - ./server/src:/server/src
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./dashboard/client
    expose:
      - "5173"

