spring.application.name=homeserver

# SMTP settings for AlertService - real credentials come from environment variables
# (see server/.env.example), never committed here.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Address alert emails are sent from - most SMTP providers require this to match MAIL_USERNAME.
alert.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# Minimum minutes between repeat alerts for the same container while it stays down.
alert.renotify-minutes=${ALERT_RENOTIFY_MINUTES:30}
# Where the owner's alert email is persisted - outside the source tree, gitignored.
alert.email.store-path=${ALERT_EMAIL_STORE_PATH:data/alert-owner-email.txt}
